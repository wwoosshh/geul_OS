[package]
name = "geulos-shell"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GeulOS interactive CLI shell (REPL + script mode) for verification"

[[bin]]
name = "geulosh"
path = "src/main.rs"

[lib]
name = "geulos_shell"
path = "src/lib.rs"

[dependencies]
geulos-core = { path = "../../core" }
serde_json = "1.0"
thiserror = "1.0"
