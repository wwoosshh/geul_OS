[package]
name = "geulos-ai-bridge"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GeulOS AI bridge: LLM adapter (Claude/etc.) + wire client + session manager"

[[bin]]
name = "geulos-ai-bridge"
path = "src/main.rs"

[lib]
name = "geulos_ai_bridge"
path = "src/lib.rs"

[dependencies]
geulos-core = { path = "../core" }
geulos-proto = { path = "../proto" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
reqwest = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
thiserror = "1.0"
toml = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
geulos-server-host = { path = "../server-host" }
tempfile = "3.27"
