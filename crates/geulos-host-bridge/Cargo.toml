[package]
name = "geulos-host-bridge"
version = "0.0.1"
edition.workspace = true

[[bin]]
name = "geulos-host-bridge"
path = "src/main.rs"

[dependencies]
geulos-proto = { path = "../../proto" }
serde = { workspace = true }
serde_json = "1.0"
base64 = "0.22"
uuid = { workspace = true }
once_cell = "1.20"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi"] }
