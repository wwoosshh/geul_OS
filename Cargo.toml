[workspace]
resolver = "2"
members = [
    "core",
    "proto",
    "compositor",
    "ai-bridge",
    "apps/echo-app",
    "apps/notepad-app",
    "tools/geulosh",
    "server-host",
    "geulos-init",
]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wwoosshh/geul_OS"

[workspace.dependencies]
uuid = { version = "1.8", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
proptest = "1.4"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs"] }
toml = "0.8"
winit = "0.30"
softbuffer = "0.4"
fontdue = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1.0"
async-trait = "0.1"
chrono = "0.4"
dotenvy = "0.15"
nix = { version = "0.29", features = ["mount", "process", "signal", "fs"] }
