[workspace]
resolver = "2"
members = [
    "core",
    "proto",
    "compositor",
    "glue-ai",
    "apps/echo-app",
    "tools/geulosh",
    "server-host",
]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wwoosshh/geul_OS"

[workspace.dependencies]
uuid = { version = "1.8", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
proptest = "1.4"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
toml = "0.8"
