[package]
name = "geulos-notepad-app"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GeulOS notepad — daily-driver memo app for M7 dogfooding"

[[bin]]
name = "geulos-notepad-app"
path = "src/main.rs"

[lib]
name = "geulos_notepad_app"
path = "src/lib.rs"

[dependencies]
geulos-core = { path = "../../core" }
geulos-proto = { path = "../../proto" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3.27"
